baseURL: https://dzds.me/
languageCode: en-us
title: 多做多说

theme: "PaperMod"
hasCJKLanguage: true

taxonomies:
  tag: tags
  category: categories

# 在页面上方加入菜单
menu:
  main:
    - name: 主页
      url: /
      weight: 1
    - identifier: archives
      name: 归档
      url: archives/
      weight: 10
    - name: 标签
      url: tags/
      weight: 4
    - identifier: search
      name: 搜索
      url: /search/
      weight: 20

pagination:
  pagerSize: 10
enableEmoji: true

outputs:
  home:
    - HTML
    - RSS
    - JSON 

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  disableSpecial1stPost: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  keywords: [Blog, Engineering, Algorithm]
  images: ["img/icon.png"]
  DateFormat: "January 2, 2006"
  ShowShareButtons: false
  ShowWordCount: true
  UseHugoToc: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/favicon.ico"
    favicon16x16: "/img/icon.png"
    favicon32x32: "/img/icon.png"
    apple_touch_icon: "/img/icon.png"
    safari_pinned_tab: "/img/icon.png"
