<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="Event-Sourced Agent State">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
<style>
text{font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#0f172a} .title{font-size:34px;font-weight:800}.subtitle{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#334155}.tiny{font-size:12px;fill:#475569}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.muted{fill:#64748b}
</style>
</defs>
<rect x="0" y="0" width="1100" height="430" fill="#f8fafc"/>
<text x="550" y="44" text-anchor="middle" class="title">Event-Sourced Agent State</text>
<text x="550" y="72" text-anchor="middle" class="subtitle">Append events, reduce them into current run state</text>
<rect x="70" y="135" width="320" height="210" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter=""/>
<text x="230" y="165" class="label" text-anchor="middle">Events</text>
<circle cx="96" cy="188" r="4" fill="#2563eb"/>
<text x="112" y="193" class="small" text-anchor="start">RunCreated</text>
<circle cx="96" cy="213" r="4" fill="#2563eb"/>
<text x="112" y="218" class="small" text-anchor="start">ModelResponded</text>
<circle cx="96" cy="238" r="4" fill="#2563eb"/>
<text x="112" y="243" class="small" text-anchor="start">ToolCallStarted</text>
<circle cx="96" cy="263" r="4" fill="#2563eb"/>
<text x="112" y="268" class="small" text-anchor="start">ToolCallSucceeded</text>
<circle cx="96" cy="288" r="4" fill="#2563eb"/>
<text x="112" y="293" class="small" text-anchor="start">CheckpointWritten</text>
<rect x="490" y="200" width="120" height="80" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter=""/>
<text x="550" y="230" class="label" text-anchor="middle">Reducer</text>
<rect x="710" y="135" width="320" height="210" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2" filter=""/>
<text x="870" y="165" class="label" text-anchor="middle">Current State</text>
<circle cx="736" cy="188" r="4" fill="#15803d"/>
<text x="752" y="193" class="small" text-anchor="start">status</text>
<circle cx="736" cy="213" r="4" fill="#15803d"/>
<text x="752" y="218" class="small" text-anchor="start">current step</text>
<circle cx="736" cy="238" r="4" fill="#15803d"/>
<text x="752" y="243" class="small" text-anchor="start">pending action</text>
<circle cx="736" cy="263" r="4" fill="#15803d"/>
<text x="752" y="268" class="small" text-anchor="start">latest checkpoint</text>
<circle cx="736" cy="288" r="4" fill="#15803d"/>
<text x="752" y="293" class="small" text-anchor="start">recoverability</text>
<line x1="390" y1="240" x2="490" y2="240" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="610" y1="240" x2="710" y2="240" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
