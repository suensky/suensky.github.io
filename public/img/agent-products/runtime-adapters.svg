<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Same Agent Runtime, Multiple Interface Adapters">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
<style>
text{font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#0f172a} .title{font-size:34px;font-weight:800}.subtitle{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#334155}.tiny{font-size:12px;fill:#475569}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.muted{fill:#64748b}
</style>
</defs>
<rect x="0" y="0" width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="44" text-anchor="middle" class="title">Same Agent Runtime, Multiple Interface Adapters</text>
<text x="600" y="72" text-anchor="middle" class="subtitle">Adapters shape experience; they do not create separate agents</text>
<rect x="430" y="170" width="340" height="170" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="200" class="label" text-anchor="middle">Same Agent Runtime</text>
<text x="600" y="222" class="tiny" text-anchor="middle">Run API + context + tools + memory</text>
<rect x="100" y="120" width="190" height="70" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter=""/>
<text x="195" y="150" class="label" text-anchor="middle">Web</text>
<line x1="290" y1="155" x2="430" y2="255" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="100" y="260" width="190" height="70" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter=""/>
<text x="195" y="290" class="label" text-anchor="middle">Mobile</text>
<line x1="290" y1="295" x2="430" y2="255" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="100" y="400" width="190" height="70" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter=""/>
<text x="195" y="430" class="label" text-anchor="middle">Voice</text>
<line x1="290" y1="435" x2="430" y2="255" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="930" y="120" width="190" height="70" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter=""/>
<text x="1025" y="150" class="label" text-anchor="middle">Desktop</text>
<line x1="930" y1="155" x2="770" y2="255" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="930" y="260" width="190" height="70" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter=""/>
<text x="1025" y="290" class="label" text-anchor="middle">CLI / TUI</text>
<line x1="930" y1="295" x2="770" y2="255" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="930" y="400" width="190" height="70" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter=""/>
<text x="1025" y="430" class="label" text-anchor="middle">API / Webhook / MCP</text>
<line x1="930" y1="435" x2="770" y2="255" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
