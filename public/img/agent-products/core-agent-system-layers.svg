<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Core Agent System">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
<style>
text{font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#0f172a} .title{font-size:34px;font-weight:800}.subtitle{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#334155}.tiny{font-size:12px;fill:#475569}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.muted{fill:#64748b}
</style>
</defs>
<rect x="0" y="0" width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="44" text-anchor="middle" class="title">Core Agent System</text>
<text x="600" y="72" text-anchor="middle" class="subtitle">Stateful context, stateless reasoning, and governed execution inside one system boundary</text>
<rect x="70" y="125" width="1060" height="320" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="600" y="155" class="label" text-anchor="middle">Agent System Boundary</text>
<rect x="110" y="205" width="290" height="170" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2" filter=""/>
<text x="255" y="235" class="label" text-anchor="middle">2.1 Stateful Context</text>
<circle cx="136" cy="258" r="4" fill="#15803d"/>
<text x="152" y="263" class="small" text-anchor="start">Persistent state</text>
<circle cx="136" cy="283" r="4" fill="#15803d"/>
<text x="152" y="288" class="small" text-anchor="start">Memory</text>
<circle cx="136" cy="308" r="4" fill="#15803d"/>
<text x="152" y="313" class="small" text-anchor="start">Checkpoints</text>
<circle cx="136" cy="333" r="4" fill="#15803d"/>
<text x="152" y="338" class="small" text-anchor="start">Approvals</text>
<rect x="455" y="205" width="290" height="170" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2" filter=""/>
<text x="600" y="235" class="label" text-anchor="middle">2.2 Stateless Agent</text>
<circle cx="481" cy="258" r="4" fill="#6d28d9"/>
<text x="497" y="263" class="small" text-anchor="start">Reasoning loop</text>
<circle cx="481" cy="283" r="4" fill="#6d28d9"/>
<text x="497" y="288" class="small" text-anchor="start">Planning</text>
<circle cx="481" cy="308" r="4" fill="#6d28d9"/>
<text x="497" y="313" class="small" text-anchor="start">Routing</text>
<circle cx="481" cy="333" r="4" fill="#6d28d9"/>
<text x="497" y="338" class="small" text-anchor="start">Output composition</text>
<rect x="800" y="205" width="290" height="170" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter=""/>
<text x="945" y="235" class="label" text-anchor="middle">2.3 Tool Layer</text>
<circle cx="826" cy="258" r="4" fill="#ea580c"/>
<text x="842" y="263" class="small" text-anchor="start">MCP</text>
<circle cx="826" cy="283" r="4" fill="#ea580c"/>
<text x="842" y="288" class="small" text-anchor="start">APIs</text>
<circle cx="826" cy="308" r="4" fill="#ea580c"/>
<text x="842" y="313" class="small" text-anchor="start">Skills</text>
<circle cx="826" cy="333" r="4" fill="#ea580c"/>
<text x="842" y="338" class="small" text-anchor="start">CLI / sandbox</text>
<line x1="400" y1="290" x2="455" y2="290" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="455" y1="290" x2="400" y2="290" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="745" y1="290" x2="800" y2="290" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="800" y1="290" x2="745" y2="290" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
