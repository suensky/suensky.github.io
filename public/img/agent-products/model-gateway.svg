<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-label="AI Infrastructure: Model Gateway and Serving">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#334155"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#2563eb"/></marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#dc2626"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/></filter>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
    .title{font-size:38px;font-weight:850}.subtitle{font-size:18px;fill:#475569}.h{font-size:23px;font-weight:800}.body{font-size:17px;fill:#334155}.small{font-size:15px;fill:#475569}.tiny{font-size:13px;fill:#64748b}.num{font-size:18px;font-weight:850;fill:#fff}
  </style>
</defs>
<rect width="1500" height="850" fill="#f8fafc"/>
<text x="750" y="50" text-anchor="middle" class="title">AI Infrastructure: Model Gateway and Serving</text>
<text x="750" y="82" text-anchor="middle" class="subtitle">Routing, inference, retrieval, and serving capacity behind the agent system</text>
<rect x="70" y="335" width="230" height="125" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.3" filter="url(#shadow)"/>
<text x="185" y="373" class="h" text-anchor="middle">Agent System</text>
<text x="185" y="401" class="small" text-anchor="middle">context + agent + tools</text>
