<circle cx="455" cy="409" r="4.5" fill="#dc2626"/>
<text x="471" y="414" class="body" text-anchor="start">cost budget</text>
<circle cx="455" cy="441" r="4.5" fill="#dc2626"/>
<text x="471" y="446" class="body" text-anchor="start">data policy</text>
<circle cx="455" cy="473" r="4.5" fill="#dc2626"/>
<text x="471" y="478" class="body" text-anchor="start">fallback rules</text>
<line x1="300" y1="398" x2="415" y2="398" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="850" y="150" width="255" height="120" rx="18" fill="#fff" stroke="#dc2626" stroke-width="2.3" filter="url(#shadow)"/>
<text x="977.5" y="188" class="h" text-anchor="middle">Frontier APIs</text>
<text x="977.5" y="216" class="small" text-anchor="middle">hard reasoning, tool use</text>
<rect x="1150" y="150" width="255" height="120" rx="18" fill="#fff" stroke="#dc2626" stroke-width="2.3" filter="url(#shadow)"/>
<text x="1277.5" y="188" class="h" text-anchor="middle">Self-hosted LLMs</text>
<text x="1277.5" y="216" class="small" text-anchor="middle">data control, custom policy</text>
<rect x="850" y="340" width="255" height="120" rx="18" fill="#fff" stroke="#dc2626" stroke-width="2.3" filter="url(#shadow)"/>
<text x="977.5" y="378" class="h" text-anchor="middle">Small Models</text>
<text x="977.5" y="406" class="small" text-anchor="middle">routing, extraction, checks</text>
<rect x="1150" y="340" width="255" height="120" rx="18" fill="#fff" stroke="#dc2626" stroke-width="2.3" filter="url(#shadow)"/>
<text x="1277.5" y="378" class="h" text-anchor="middle">Specialized Models</text>
<text x="1277.5" y="406" class="small" text-anchor="middle">SQL, vision, speech, code</text>
