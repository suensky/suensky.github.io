<path d="M725 380 C785 305 1050 215 1150 210" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/>
<path d="M725 415 C775 415 790 400 850 400" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/>
<path d="M725 445 C785 510 1050 410 1150 400" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/>
<rect x="150" y="650" width="1200" height="120" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.3" filter="url(#shadow)"/>
<text x="750" y="688" class="h" text-anchor="middle">Serving Layer</text>
<text x="750" y="716" class="small" text-anchor="middle">inference servers, batching, KV cache, scheduling, autoscaling, queueing, prompt cache, cost tracking</text>
<path d="M570 535 C570 585 570 610 570 650" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M980 460 C980 535 980 600 980 650" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="750" y="810" class="subtitle" text-anchor="middle">The gateway hides provider differences while preserving policy, cost attribution, and fallback behavior.</text>
</svg>
