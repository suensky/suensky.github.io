<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Option A mockup: Editorial Reading Room</title>
  <desc id="desc">A warm editorial personal blog homepage mockup for 多做多说, focused on reading, essays, and dated post rows.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .serif { font-family: "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif; }
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .bg { fill: #f7f8f3; }
      .ink { fill: #171814; }
      .muted { fill: #696c61; }
      .faint { fill: #a6aa9b; }
      .line { stroke: #d9ddcf; stroke-width: 1; }
      .heavy { stroke: #171814; stroke-width: 2; }
      .accent { fill: #b8412d; }
      .green { fill: #286b5a; }
      .gold { fill: #c08a27; }
      .panel { fill: #ffffff; stroke: #d9ddcf; stroke-width: 1; }
      .tag { fill: #eef2df; stroke: #ccd4b9; stroke-width: 1; }
      text { letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1440" height="1080" class="bg"/>
  <rect x="44" y="40" width="1352" height="1000" fill="none" stroke="#d3d8c7" stroke-width="1"/>
  <line x1="44" y1="126" x2="1396" y2="126" class="line"/>
  <line x1="250" y1="126" x2="250" y2="1040" class="line"/>
  <line x1="1070" y1="126" x2="1070" y2="1040" class="line"/>

  <text x="82" y="94" class="mono faint" font-size="14">HU SUN / PERSONAL BLOG</text>
  <text x="1255" y="94" class="sans muted" font-size="16" text-anchor="end">Archive</text>
  <text x="1330" y="94" class="sans muted" font-size="16" text-anchor="end">RSS</text>
  <circle cx="1362" cy="87" r="18" fill="#eef2df" stroke="#cdd4bd"/>
  <path d="M1354 87h16M1362 79v16" stroke="#286b5a" stroke-width="2" stroke-linecap="round"/>

  <g transform="translate(72 170)">
    <text x="0" y="0" class="mono faint" font-size="13">OPTION A</text>
    <text x="0" y="34" class="sans ink" font-size="24" font-weight="600">Editorial Reading Room</text>
    <text x="0" y="78" class="sans muted" font-size="15">Literary, calm,</text>
    <text x="0" y="104" class="sans muted" font-size="15">article-first.</text>
    <rect x="0" y="138" width="126" height="34" rx="4" class="accent"/>
    <text x="16" y="160" class="mono" fill="#fff8ed" font-size="13">READING FIRST</text>
  </g>

  <g transform="translate(296 178)">
    <rect x="0" y="0" width="110" height="8" class="accent"/>
    <text x="0" y="102" class="serif ink" font-size="94" font-weight="700">多做多说</text>
    <text x="4" y="150" class="serif muted" font-size="30">文如其人，看文章就够了。</text>
    <text x="4" y="194" class="sans muted" font-size="17">技术与随笔的个人博客。写 AI 系统、算法、诗、远行与日常。</text>

    <g transform="translate(0 246)">
      <line x1="0" y1="0" x2="722" y2="0" class="heavy"/>
      <text x="0" y="44" class="mono faint" font-size="13">RECENTLY PUBLISHED</text>

      <g transform="translate(0 82)">
        <text x="0" y="0" class="mono faint" font-size="13">2026.05.02</text>
        <text x="132" y="3" class="serif ink" font-size="29">From AI Agent Demo to Production System</text>
        <text x="132" y="38" class="sans muted" font-size="16">A full-stack blueprint for durable agent products, context layers, tools, and recovery.</text>
        <rect x="132" y="58" width="70" height="28" rx="3" class="tag"/>
        <text x="150" y="77" class="sans green" font-size="13">代码如诗</text>
      </g>
      <line x1="0" y1="198" x2="722" y2="198" class="line"/>
      <g transform="translate(0 244)">
        <text x="0" y="0" class="mono faint" font-size="13">2026.02.14</text>
        <text x="132" y="3" class="serif ink" font-size="29">Dropbox and Box Could Become Systems of Record</text>
        <text x="132" y="38" class="sans muted" font-size="16">A product essay on memory, documents, and the interface layer around AI work.</text>
        <rect x="132" y="58" width="58" height="28" rx="3" class="tag"/>
        <text x="150" y="77" class="sans green" font-size="13">AI</text>
      </g>
      <line x1="0" y1="360" x2="722" y2="360" class="line"/>
      <g transform="translate(0 406)">
        <text x="0" y="0" class="mono faint" font-size="13">2025.12.31</text>
        <text x="132" y="3" class="serif ink" font-size="29">别2025，致2026</text>
        <text x="132" y="38" class="sans muted" font-size="16">A year-end note, personal but restrained, designed to sit beside technical work.</text>
        <rect x="132" y="58" width="54" height="28" rx="3" class="tag"/>
        <text x="150" y="77" class="sans green" font-size="13">随笔</text>
      </g>
    </g>
  </g>

  <g transform="translate(1110 178)">
    <text x="0" y="0" class="mono faint" font-size="13">INDEX</text>
    <text x="0" y="40" class="sans ink" font-size="22" font-weight="600">Shelves</text>
    <line x1="0" y1="65" x2="246" y2="65" class="line"/>
    <g transform="translate(0 105)">
      <circle cx="8" cy="-5" r="5" class="accent"/>
      <text x="26" y="0" class="sans ink" font-size="18">代码如诗</text>
      <text x="206" y="0" class="mono faint" font-size="13">18</text>
    </g>
    <g transform="translate(0 152)">
      <circle cx="8" cy="-5" r="5" class="green"/>
      <text x="26" y="0" class="sans ink" font-size="18">人间随笔</text>
      <text x="206" y="0" class="mono faint" font-size="13">11</text>
    </g>
    <g transform="translate(0 199)">
      <circle cx="8" cy="-5" r="5" class="gold"/>
      <text x="26" y="0" class="sans ink" font-size="18">诗与翻译</text>
      <text x="206" y="0" class="mono faint" font-size="13">7</text>
    </g>
    <line x1="0" y1="248" x2="246" y2="248" class="line"/>
    <text x="0" y="304" class="serif ink" font-size="36">“做做技术，</text>
    <text x="0" y="350" class="serif ink" font-size="36">谈谈人生。”</text>
    <text x="0" y="404" class="sans muted" font-size="15">The homepage behaves</text>
    <text x="0" y="428" class="sans muted" font-size="15">like a table of contents:</text>
    <text x="0" y="452" class="sans muted" font-size="15">fewer boxes, stronger dates.</text>

    <g transform="translate(0 520)">
      <rect x="0" y="0" width="204" height="204" fill="none" stroke="#b8412d" stroke-width="2"/>
      <text x="102" y="88" class="serif accent" font-size="42" font-weight="700" text-anchor="middle">多</text>
      <text x="102" y="132" class="serif accent" font-size="42" font-weight="700" text-anchor="middle">说</text>
      <line x1="18" y1="18" x2="186" y2="186" stroke="#e3c6bd"/>
      <line x1="186" y1="18" x2="18" y2="186" stroke="#e3c6bd"/>
    </g>
  </g>

  <text x="720" y="1014" class="mono faint" font-size="13" text-anchor="middle">Mood: literary, quiet, permanent. Implementation scope: homepage + article typography + archive rows.</text>
</svg>
